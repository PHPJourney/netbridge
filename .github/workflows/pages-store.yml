name: Pages Store

on:
  push:
    branches: [main]
    paths:
      - "apps/store/**"
      - ".github/workflows/pages-store.yml"
  workflow_dispatch:

# Private commercial repo cannot use GitHub Pages like the public mirror.
# Restrict deploy (and build) to PHPJourney/netbridge only.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'PHPJourney/netbridge'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/store
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/store/package-lock.json
      - run: npm ci
      - name: Build with GitHub Pages base
        env:
          VITE_BASE: /netbridge/
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/store/dist

  deploy:
    if: github.repository == 'PHPJourney/netbridge'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
