name: Build Clients

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.35.1"

jobs:
  android:
    name: Android APK (R8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/netbridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      # Android release signing (optional):
      # Set all four secrets for a stable upload-keystore signature:
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      #   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      # Without them, release APKs fall back to debug signing (sideload / trial only).
      # See clients/netbridge/android/SIGNING.md
      - name: Configure Android release keystore
        working-directory: clients/netbridge/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" && -n "${ANDROID_KEYSTORE_PASSWORD:-}" \
            && -n "${ANDROID_KEY_ALIAS:-}" && -n "${ANDROID_KEY_PASSWORD:-}" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
            {
              echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
              echo "keyPassword=${ANDROID_KEY_PASSWORD}"
              echo "keyAlias=${ANDROID_KEY_ALIAS}"
              echo "storeFile=upload-keystore.jks"
            } > key.properties
            echo "Release signing: key.properties written (upload-keystore)."
          else
            echo "::warning::Android signing secrets missing — APK will be DEBUG-signed (sideload). See clients/netbridge/android/SIGNING.md"
          fi
      - name: Build release APKs (split ABI, R8)
        run: flutter build apk --release --split-per-abi
      - name: Stage artifacts
        run: |
          mkdir -p dist
          ARM64=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          V7A=build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          cp -f "$ARM64" dist/NetBridge-android-arm64.apk
          cp -f "$ARM64" dist/NetBridge-android.apk
          sha256sum dist/NetBridge-android-arm64.apk | tee dist/NetBridge-android-arm64.apk.sha256
          if [[ -f "$V7A" ]]; then
            cp -f "$V7A" dist/NetBridge-android-armeabi-v7a.apk
            sha256sum dist/NetBridge-android-armeabi-v7a.apk | tee dist/NetBridge-android-armeabi-v7a.apk.sha256
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: client-android
          path: clients/netbridge/dist/NetBridge-android*.apk*

  windows:
    name: Windows Setup + portable
    # windows-latest may be 2025 (VS 18); Flutter 3.35 defaults unknown majors to VS 2019.
    runs-on: windows-2022
    defaults:
      run:
        working-directory: clients/netbridge
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Show Visual Studio
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -format json |
            ConvertFrom-Json |
            Select-Object installationVersion, displayName, installationPath |
            Format-List
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Build Windows release
        run: flutter build windows --release
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          echo "ISCC=$iscc" >> $env:GITHUB_ENV
      - name: Stage Setup.exe + portable zip
        shell: pwsh
        env:
          NBVPN_VERSION: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $rel = "build\windows\x64\runner\Release"
          if (-not (Test-Path "$rel\netbridge.exe")) { throw "netbridge.exe missing under $rel" }
          Copy-Item "$rel\netbridge.exe" dist\NetBridge-windows.exe -Force
          Compress-Archive -Path "$rel\*" -DestinationPath dist\NetBridge-windows-portable.zip -Force
          Get-FileHash dist\NetBridge-windows.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  NetBridge-windows.exe" } |
            Set-Content dist\NetBridge-windows.exe.sha256
          Get-FileHash dist\NetBridge-windows-portable.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  NetBridge-windows-portable.zip" } |
            Set-Content dist\NetBridge-windows-portable.zip.sha256
          & .\installer\windows\build-setup.ps1 -ReleaseDir (Resolve-Path $rel) -OutDir (Resolve-Path dist) -Version $env:NBVPN_VERSION
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: client-windows
          path: |
            clients/netbridge/dist/NetBridge-windows-setup.exe
            clients/netbridge/dist/NetBridge-windows-setup.exe.sha256
            clients/netbridge/dist/NetBridge-windows-portable.zip
            clients/netbridge/dist/NetBridge-windows-portable.zip.sha256
            clients/netbridge/dist/NetBridge-windows.exe
            clients/netbridge/dist/NetBridge-windows.exe.sha256

  macos:
    name: macOS pkg (signed + notarized)
    runs-on: macos-latest
    env:
      FLUTTER_VERSION: ${{ env.FLUTTER_VERSION }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build obfs2 bridge xcframework
        run: |
          export PATH="$PATH:$HOME/go/bin" GOTOOLCHAIN=local
          cd server/nbvpn/mobile
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20231127183840-76ac6878050a
          gomobile bind -target=macos -o "$GITHUB_WORKSPACE/clients/netbridge/macos/obfs2bridge/Obfs2bridge.xcframework" ./obfs2bridge
      - name: Import signing certs into keychain
        env:
          DEV_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          DEV_P12_PW: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          INSTALLER_P12: ${{ secrets.APPLE_INSTALLER_P12 }}
          INSTALLER_P12_PW: ${{ secrets.APPLE_INSTALLER_P12_PASSWORD }}
        run: |
          echo "$DEV_P12" | base64 -d > /tmp/dev.p12
          echo "$INSTALLER_P12" | base64 -d > /tmp/installer.p12
          security import /tmp/dev.p12 -k ~/Library/Keychains/login.keychain-db -P "$DEV_P12_PW" -T /usr/bin/codesign -T /usr/bin/productsign || true
          security import /tmp/installer.p12 -k ~/Library/Keychains/login.keychain-db -P "$INSTALLER_P12_PW" -T /usr/bin/codesign -T /usr/bin/productsign || true
          security list-keychains -d user -s login.keychain-db
      - name: Store notarytool credentials
        env:
          NA_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          NA_PW: ${{ secrets.NOTARYTOOL_APPLE_ID_PASSWORD }}
          NA_TEAM: ${{ secrets.NOTARYTOOL_TEAM_ID }}
        run: |
          if [[ -n "$NA_ID" && -n "$NA_PW" && -n "$NA_TEAM" ]]; then
            xcrun notarytool store-credentials NetBridge --apple-id "$NA_ID" --team-id "$NA_TEAM" --password "$NA_PW"
          else
            echo "::warning::notarytool secrets missing — pkg will not be notarized"
          fi
      - name: Package (build + sign + notarize + pkg)
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_INSTALLER_P12: ${{ secrets.APPLE_INSTALLER_P12 }}
          APPLE_INSTALLER_P12_PASSWORD: ${{ secrets.APPLE_INSTALLER_P12_PASSWORD }}
          NOTARYTOOL_APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          NOTARYTOOL_APPLE_ID_PASSWORD: ${{ secrets.NOTARYTOOL_APPLE_ID_PASSWORD }}
          NOTARYTOOL_TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
        run: |
          cd clients/netbridge
          ./scripts/package-macos-pkg.sh || { echo "::warning::macOS packaging failed — see log"; exit 0; }
      - uses: actions/upload-artifact@v4
        with:
          name: client-macos-pkg
          path: clients/netbridge/dist/NetBridge-macOS-*.pkg
          if-no-files-found: warn

  ios:
    name: iOS IPA (signed if APPLE_TEAM_ID set)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: cd clients/netbridge && flutter pub get
      - name: Build iOS IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd clients/netbridge
          if [[ -n "$APPLE_TEAM_ID" ]]; then
            flutter build ipa --release --export-options-plist=ios/ExportOptions.plist || echo "::warning::ipa export failed"
          else
            echo "::warning::APPLE_TEAM_ID secret missing — building unsigned archive"
            flutter build ios --release --no-codesign || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: client-ios-ipa
          path: clients/netbridge/build/ios/ipa/*.ipa
          if-no-files-found: ignore

  release-clients:
    name: Attach client artifacts to Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, windows, macos, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: clients-out
          pattern: client-*
          merge-multiple: true
      - name: Flatten
        run: |
          mkdir -p upload
          find clients-out -type f -exec cp -f {} upload/ \;
          ls -la upload
      - name: Normalize release asset names
        run: |
          cd upload
          shopt -s nullglob
          # Stable names so apps store links survive version bumps.
          for f in NetBridge-macOS-*.pkg; do mv "$f" NetBridge-macOS.pkg; done
          for f in *.ipa; do mv "$f" NetBridge-iOS.ipa; done
          ls -la upload
      # Client-only tags become GitHub "latest" and previously omitted nbvpn-linux-*,
      # which 404s curl|bash install (releases/latest/download/nbvpn-linux-amd64).
      # If Build Server has not attached them yet, backfill from the newest prior
      # release that published those assets so latest stays installable.
      - name: Backfill nbvpn linux server binaries if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          need=(nbvpn-linux-amd64 nbvpn-linux-amd64.sha256 nbvpn-linux-arm64 nbvpn-linux-arm64.sha256)
          missing=0
          for f in "${need[@]}"; do
            [[ -f "upload/$f" ]] || missing=1
          done
          if [[ "$missing" -eq 0 ]]; then
            echo "Server linux assets already staged."
            exit 0
          fi
          echo "Client upload lacks nbvpn-linux-* — scanning prior releases to backfill…"
          api="https://api.github.com/repos/${REPO}/releases?per_page=40"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "$api" -o /tmp/releases.json
          python3 <<'PY'
          import json, os, urllib.request
          with open("/tmp/releases.json", encoding="utf-8") as f:
              rels = json.load(f)
          want = [
              "nbvpn-linux-amd64",
              "nbvpn-linux-amd64.sha256",
              "nbvpn-linux-arm64",
              "nbvpn-linux-arm64.sha256",
          ]
          token = os.environ.get("GH_TOKEN", "")
          found = False
          for r in rels:
              if r.get("draft"):
                  continue
              by_name = {a["name"]: a for a in (r.get("assets") or [])}
              if "nbvpn-linux-amd64" not in by_name:
                  continue
              found = True
              print(f"Backfilling from {r.get('tag_name')}", flush=True)
              for name in want:
                  a = by_name.get(name)
                  if not a:
                      continue
                  dest = os.path.join("upload", name)
                  if os.path.isfile(dest):
                      continue
                  req = urllib.request.Request(
                      a["url"],
                      headers={
                          "Accept": "application/octet-stream",
                          "Authorization": f"Bearer {token}",
                          "User-Agent": "netbridge-ci-backfill",
                      },
                  )
                  with urllib.request.urlopen(req) as resp, open(dest, "wb") as out:
                      out.write(resp.read())
                  print(f"  + {name} ({os.path.getsize(dest)} bytes)", flush=True)
              break
          if not found:
              print(
                  "WARNING: no prior release had nbvpn-linux-amd64 — "
                  "install may 404 until Build Server uploads.",
                  flush=True,
              )
          PY
          ls -la upload/nbvpn-linux-* 2>/dev/null || true
      - uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
