name: Build Clients

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.35.1"

jobs:
  android:
    name: Android APK (R8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/netbridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Build release APKs (split ABI, R8)
        run: flutter build apk --release --split-per-abi
      - name: Stage artifacts
        run: |
          mkdir -p dist
          ARM64=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          V7A=build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          cp -f "$ARM64" dist/NetBridge-android-arm64.apk
          cp -f "$ARM64" dist/NetBridge-android.apk
          sha256sum dist/NetBridge-android-arm64.apk | tee dist/NetBridge-android-arm64.apk.sha256
          if [[ -f "$V7A" ]]; then
            cp -f "$V7A" dist/NetBridge-android-armeabi-v7a.apk
            sha256sum dist/NetBridge-android-armeabi-v7a.apk | tee dist/NetBridge-android-armeabi-v7a.apk.sha256
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: client-android
          path: clients/netbridge/dist/NetBridge-android*.apk*

  windows:
    name: Windows Setup + portable
    # windows-latest may be 2025 (VS 18); Flutter 3.35 defaults unknown majors to VS 2019.
    runs-on: windows-2022
    defaults:
      run:
        working-directory: clients/netbridge
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Show Visual Studio
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -format json |
            ConvertFrom-Json |
            Select-Object installationVersion, displayName, installationPath |
            Format-List
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Build Windows release
        run: flutter build windows --release
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          echo "ISCC=$iscc" >> $env:GITHUB_ENV
      - name: Stage Setup.exe + portable zip
        shell: pwsh
        env:
          NBVPN_VERSION: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $rel = "build\windows\x64\runner\Release"
          if (-not (Test-Path "$rel\netbridge.exe")) { throw "netbridge.exe missing under $rel" }
          Copy-Item "$rel\netbridge.exe" dist\NetBridge-windows.exe -Force
          Compress-Archive -Path "$rel\*" -DestinationPath dist\NetBridge-windows-portable.zip -Force
          Get-FileHash dist\NetBridge-windows.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  NetBridge-windows.exe" } |
            Set-Content dist\NetBridge-windows.exe.sha256
          Get-FileHash dist\NetBridge-windows-portable.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  NetBridge-windows-portable.zip" } |
            Set-Content dist\NetBridge-windows-portable.zip.sha256
          & .\installer\windows\build-setup.ps1 -ReleaseDir (Resolve-Path $rel) -OutDir (Resolve-Path dist) -Version $env:NBVPN_VERSION
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: client-windows
          path: |
            clients/netbridge/dist/NetBridge-windows-setup.exe
            clients/netbridge/dist/NetBridge-windows-setup.exe.sha256
            clients/netbridge/dist/NetBridge-windows-portable.zip
            clients/netbridge/dist/NetBridge-windows-portable.zip.sha256
            clients/netbridge/dist/NetBridge-windows.exe
            clients/netbridge/dist/NetBridge-windows.exe.sha256

  macos-note:
    name: macOS (skipped — no distribution)
    runs-on: ubuntu-latest
    steps:
      - name: Skip macOS Release artifacts
        run: |
          echo "macOS client is local-source / business-use only for now."
          echo "No DMG / .app.zip attached to GitHub Releases."
          mkdir -p note
          cat > note/MACOS-CI-SKIP.txt <<'TXT'
          NetBridge macOS: CI does not publish distribution packages (DMG / app.zip).
          Local business use: cd clients/netbridge && flutter run -d macos
          Real VPN without NE signing: official WireGuard app + nbvpn show --conf (.conf).
          Optional local ad-hoc .app via scripts/package-all.sh — not for OpenList/Pages download.
          See docs/delivery/nbvpn/TRY-CONNECT.md section「本机 macOS 业务」.
          TXT
      - uses: actions/upload-artifact@v4
        with:
          name: client-macos-skip-note
          path: note/MACOS-CI-SKIP.txt

  ios-note:
    name: iOS (skipped — no signing)
    runs-on: ubuntu-latest
    steps:
      - name: Skip IPA
        run: |
          echo "iOS IPA signing deferred (no Apple certs in CI)."
          echo "Build unsigned/stub locally later; do not block client pipeline."
          mkdir -p note
          cat > note/IOS-CI-SKIP.txt <<'TXT'
          NetBridge iOS: CI does not produce a signed IPA.
          Signing / notarization / TestFlight will be handled later.
          Use local package-all.sh with APPLE_TEAM_ID when ready.
          TXT
      - uses: actions/upload-artifact@v4
        with:
          name: client-ios-skip-note
          path: note/IOS-CI-SKIP.txt

  release-clients:
    name: Attach client artifacts to Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, windows, macos-note, ios-note]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: clients-out
          pattern: client-*
          merge-multiple: true
      - name: Flatten
        run: |
          mkdir -p upload
          find clients-out -type f -exec cp -f {} upload/ \;
          ls -la upload
      - uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
