name: Build Server

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: linux-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    defaults:
      run:
        working-directory: server/nbvpn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: server/nbvpn/go.sum
      - name: Test
        env:
          CGO_ENABLED: "0"
        # Skip cmd/nbvpn-gui (Fyne needs CGO/OpenGL); all unit tests live under internal/
        run: go test ./internal/...
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "dist/nbvpn-linux-${{ matrix.goarch }}" .
          (cd dist && sha256sum "nbvpn-linux-${{ matrix.goarch }}" > "nbvpn-linux-${{ matrix.goarch }}.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: nbvpn-linux-${{ matrix.goarch }}
          path: |
            server/nbvpn/dist/nbvpn-linux-${{ matrix.goarch }}
            server/nbvpn/dist/nbvpn-linux-${{ matrix.goarch }}.sha256

  windows-win10:
    name: windows-amd64 (Win10+)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/nbvpn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: server/nbvpn/go.sum
      - name: Build Win10+ CLI
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/nbvpn-windows-amd64.exe .
          (cd dist && sha256sum nbvpn-windows-amd64.exe > nbvpn-windows-amd64.exe.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: nbvpn-windows-amd64
          path: |
            server/nbvpn/dist/nbvpn-windows-amd64.exe
            server/nbvpn/dist/nbvpn-windows-amd64.exe.sha256

  windows-gui:
    name: windows-gui (Fyne native)
    runs-on: windows-2022
    defaults:
      run:
        working-directory: server/nbvpn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: server/nbvpn/go.sum
      - name: Install MinGW (CGO for Fyne)
        shell: pwsh
        run: choco install mingw -y --no-progress
      - name: Build nbvpn-gui (static MinGW CRT — avoid CreateProcess 14001)
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          # Dynamic libgcc/libstdc++ on clean Servers → SxS / missing DLL → 14001
          CGO_LDFLAGS: "-static-libgcc -static-libstdc++ -Wl,-Bstatic -lpthread -Wl,-Bdynamic"
        run: |
          $env:PATH = "C:\ProgramData\mingw64\mingw64\bin;C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin;$env:PATH"
          Get-Command gcc | Format-List
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath `
            -ldflags="-s -w -H windowsgui -extldflags=-static -X main.version=$env:GITHUB_REF_NAME" `
            -o dist/nbvpn-gui-windows-amd64.exe ./cmd/nbvpn-gui
          Get-FileHash dist\nbvpn-gui-windows-amd64.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  nbvpn-gui-windows-amd64.exe" } |
            Set-Content dist\nbvpn-gui-windows-amd64.exe.sha256
          # Fail CI if still dynamically linked to MinGW runtime DLLs
          $objdump = Get-Command objdump.exe -ErrorAction SilentlyContinue
          if ($objdump) {
            $deps = & objdump.exe -p dist\nbvpn-gui-windows-amd64.exe 2>$null | Select-String -Pattern 'DLL Name:'
            $deps | ForEach-Object { Write-Host $_ }
            $bad = @($deps | Where-Object { $_ -match 'libgcc_s|libstdc\+\+|libwinpthread' })
            if ($bad.Count -gt 0) {
              throw "nbvpn-gui still depends on MinGW runtime DLLs (would 14001 on clean hosts): $($bad -join '; ')"
            }
            Write-Host 'OK: no MinGW runtime DLL dependents detected'
          } else {
            Write-Warning 'objdump not found — skip DLL dependent check'
          }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: nbvpn-windows-gui
          path: |
            server/nbvpn/dist/nbvpn-gui-windows-amd64.exe
            server/nbvpn/dist/nbvpn-gui-windows-amd64.exe.sha256

  windows-win2012:
    name: windows-amd64-win2012 (Go 1.20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/nbvpn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.20.14"
          cache-dependency-path: server/nbvpn/go.sum.win2012
      - name: Build Server 2012 R2 binary
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
          GOTOOLCHAIN: local
        run: |
          mkdir -p dist
          # Fail fast if embedded Windows manifest still has the truncated Vista GUID
          # (invalid Id → ERROR_SXS_CANT_GEN_ACTCTX / 14001 on Server 2012).
          if grep -R --include='*.manifest' --include='*.syso' -n '43dc-5fe-2a023fafe7aa' .; then
            echo 'ERROR: malformed Vista supportedOS GUID in manifest/syso (causes 14001)' >&2
            exit 1
          fi
          if [[ -f go.mod.win2012 ]]; then
            cp go.mod.win2012 go.mod
            if [[ -f go.sum.win2012 ]]; then
              cp go.sum.win2012 go.sum
            fi
          else
            sed -i 's/^go .*/go 1.20/' go.mod
            sed -i '/^toolchain /d' go.mod || true
          fi
          # CLI + Win32 GUI (CGO=0) — never build Fyne cmd/nbvpn-gui into win2012 artifacts.
          go version
          test "$(go env GOVERSION)" = "go1.20.14"
          test "$(go env CGO_ENABLED)" = "0"
          go list -f '{{.ImportPath}} {{.Name}}' .
          go build -mod=readonly -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o dist/nbvpn-windows-amd64-win2012.exe .
          go build -mod=readonly -trimpath -ldflags="-s -w -H windowsgui -X main.version=${GITHUB_REF_NAME}" \
            -o dist/nbvpn-gui-win2012.exe ./cmd/nbvpn-gui-win2012
          python3 <<'PY'
          from pathlib import Path
          import struct
          def check_cli(path):
            d = Path(path).read_bytes()
            assert b"go1.20." in d, "missing go1.20"
            assert b"go1.21." not in d and b"go1.22." not in d, "wrong Go toolchain"
            assert b"fyne.io" not in d, "Fyne must not be linked into win2012 CLI"
            assert b"VCRUNTIME" not in d and b"MSVCP" not in d, "unexpected MSVC CRT strings"
            assert b"libgcc" not in d and b"libstdc" not in d, "unexpected MinGW CRT strings"
            assert b"43dc-5fe-2a023fafe7aa" not in d, "bad Vista GUID still embedded"
            if b"assemblyIdentity" in d:
                assert b"e2011457-1546-43dc-a9fe-2a023fafe7aa" in d, "manifest missing valid Vista GUID"
            e = int.from_bytes(d[0x3C:0x40], "little")
            oh = e + 24
            assert int.from_bytes(d[oh:oh+2], "little") == 0x20B, "not PE32+"
            major_os = int.from_bytes(d[oh+40:oh+42], "little")
            minor_os = int.from_bytes(d[oh+42:oh+44], "little")
            major_sub = int.from_bytes(d[oh+48:oh+50], "little")
            minor_sub = int.from_bytes(d[oh+50:oh+52], "little")
            assert (major_os, minor_os) == (6, 1), (major_os, minor_os)
            assert (major_sub, minor_sub) == (6, 1), (major_sub, minor_sub)
            print("CLI OK", path)
          def check_gui(path):
            d = Path(path).read_bytes()
            assert b"go1.20." in d, "missing go1.20"
            assert b"fyne.io" not in d, "Fyne must not be in win2012 GUI"
            assert b"libgcc" not in d and b"libstdc" not in d, "MinGW CRT in GUI"
            e = int.from_bytes(d[0x3C:0x40], "little")
            oh = e + 24
            subsystem = int.from_bytes(d[oh+68:oh+70], "little")
            assert subsystem == 2, f"GUI subsystem want 2 got {subsystem}"  # IMAGE_SUBSYSTEM_WINDOWS_GUI
            major_sub = int.from_bytes(d[oh+48:oh+50], "little")
            minor_sub = int.from_bytes(d[oh+50:oh+52], "little")
            assert (major_sub, minor_sub) == (6, 1), (major_sub, minor_sub)
            print("GUI OK", path)
          check_cli("dist/nbvpn-windows-amd64-win2012.exe")
          check_gui("dist/nbvpn-gui-win2012.exe")
          # Import table: CLI should only need kernel32.dll
          d = Path("dist/nbvpn-windows-amd64-win2012.exe").read_bytes()
          e = int.from_bytes(d[0x3C:0x40], "little")
          oh = e + 24
          num_sections = int.from_bytes(d[e+6:e+8], "little")
          opt_size = int.from_bytes(d[e+20:e+22], "little")
          sec_off = e + 24 + opt_size
          sections = []
          for i in range(num_sections):
              s = sec_off + i * 40
              va = int.from_bytes(d[s+12:s+16], "little")
              vsize = int.from_bytes(d[s+8:s+12], "little")
              rawptr = int.from_bytes(d[s+20:s+24], "little")
              rawsize = int.from_bytes(d[s+16:s+20], "little")
              sections.append((va, vsize, rawptr, rawsize))
          def rva_to_off(rva):
              for va, vsize, rawptr, rawsize in sections:
                  if va <= rva < va + max(vsize, rawsize):
                      return rawptr + (rva - va)
              return None
          dd = oh + 112
          imp_rva = int.from_bytes(d[dd+8:dd+12], "little")
          off = rva_to_off(imp_rva)
          dlls = []
          if off is not None:
              i = 0
              while True:
                  desc = d[off+i:off+i+20]
                  if desc == b"\0" * 20:
                      break
                  name_rva = int.from_bytes(desc[12:16], "little")
                  no = rva_to_off(name_rva)
                  if no:
                      dlls.append(d[no:no+64].split(b"\0")[0].decode("ascii", "replace").lower())
                  i += 20
          print("CLI imports:", dlls)
          assert dlls == ["kernel32.dll"], dlls
          print("OK: go1.20 + valid manifest + pure kernel32 imports + Win32 GUI")
          PY
          (cd dist && sha256sum nbvpn-windows-amd64-win2012.exe > nbvpn-windows-amd64-win2012.exe.sha256)
          (cd dist && sha256sum nbvpn-gui-win2012.exe > nbvpn-gui-win2012.exe.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: nbvpn-windows-amd64-win2012
          path: |
            server/nbvpn/dist/nbvpn-windows-amd64-win2012.exe
            server/nbvpn/dist/nbvpn-windows-amd64-win2012.exe.sha256
            server/nbvpn/dist/nbvpn-gui-win2012.exe
            server/nbvpn/dist/nbvpn-gui-win2012.exe.sha256

  windows-setup:
    name: Windows Setup.exe (Inno)
    needs: [windows-win10, windows-gui]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nbvpn-windows-amd64
          path: stage
      - uses: actions/download-artifact@v4
        with:
          name: nbvpn-windows-gui
          path: stage
      - name: Stage install scripts + icon
        shell: pwsh
        run: |
          Copy-Item -Force server\install\windows\install.ps1 stage\
          Copy-Item -Force server\install\windows\Install-WireGuard.ps1 stage\
          Copy-Item -Force server\install\windows\wireguard-bundle.json stage\
          Copy-Item -Force server\install\windows\WINDOWS.md stage\
          Copy-Item -Force server\install\windows\THIRDPARTY-NOTICE.txt stage\
          Copy-Item -Force server\install\windows\setup.bat stage\
          Copy-Item -Force server\install\windows\nbvpn-setup.iss stage\
          Copy-Item -Force server\install\windows\build-setup.ps1 stage\
          Copy-Item -Force server\install\windows\netbridge.ico stage\
          if (-not (Test-Path stage\nbvpn-gui-windows-amd64.exe)) { throw 'missing nbvpn-gui-windows-amd64.exe' }
          if (-not (Test-Path stage\nbvpn-windows-amd64.exe)) { throw 'missing nbvpn-windows-amd64.exe' }
          Get-ChildItem stage
      - name: Fetch pinned WireGuard MSI (required)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . .\server\install\windows\Install-WireGuard.ps1
          $pin = Get-Content .\server\install\windows\wireguard-bundle.json -Raw | ConvertFrom-Json
          $destDir = 'stage\vendor\wireguard'
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
          $msi = Join-Path $destDir $pin.filename
          Save-RemoteFileChecked -Uri $pin.url -OutFile $msi -ExpectedSha256 $pin.sha256
          Copy-Item -Force .\server\install\windows\wireguard-bundle.json (Join-Path $destDir 'wireguard-bundle.json')
          if (-not (Test-Path $msi)) { throw "MSI missing after download: $msi" }
          Get-ChildItem $destDir
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after choco install" }
          echo "ISCC=$iscc" >> $env:GITHUB_ENV
      - name: Build NetBridge-nbvpn-Setup.exe
        shell: pwsh
        env:
          NBVPN_VERSION: ${{ github.ref_name }}
        run: |
          $stage = (Resolve-Path stage).Path
          $out = Join-Path $stage 'dist'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & .\server\install\windows\build-setup.ps1 -StageDir $stage -OutDir $out -Version $env:NBVPN_VERSION
          Get-ChildItem $out
          # Verify Setup embeds MSI: Inno compile already requires vendor\wireguard\*
          $setup = Join-Path $out 'NetBridge-nbvpn-Setup.exe'
          if (-not (Test-Path $setup)) { throw "Setup missing: $setup" }
      - uses: actions/upload-artifact@v4
        with:
          name: nbvpn-windows-setup
          path: |
            stage/dist/NetBridge-nbvpn-Setup.exe
            stage/dist/NetBridge-nbvpn-Setup.exe.sha256
            stage/dist/NetBridge-nbvpn-Setup-zip.zip

  windows-setup-win2012:
    name: Windows Setup-win2012 (Inno)
    needs: [windows-win2012]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nbvpn-windows-amd64-win2012
          path: stage
      - name: Stage win2012 install scripts + icon
        shell: pwsh
        run: |
          Copy-Item -Force server\install\windows\install.ps1 stage\
          Copy-Item -Force server\install\windows\Install-WireGuard.ps1 stage\
          Copy-Item -Force server\install\windows\wireguard-bundle-win2012.json stage\
          Copy-Item -Force server\install\windows\WINDOWS.md stage\
          Copy-Item -Force server\install\windows\THIRDPARTY-NOTICE.txt stage\
          Copy-Item -Force server\install\windows\nbvpn-setup-win2012.iss stage\
          Copy-Item -Force server\install\windows\build-setup-win2012.ps1 stage\
          Copy-Item -Force server\install\windows\nbvpn-manage.cmd stage\
          Copy-Item -Force server\install\windows\nbvpn-open-cmd.cmd stage\
          Copy-Item -Force server\install\windows\nbvpn-status.cmd stage\
          Copy-Item -Force server\install\windows\README-WIN2012.txt stage\
          Copy-Item -Force server\install\windows\netbridge.ico stage\
          if (-not (Test-Path stage\nbvpn-windows-amd64-win2012.exe)) { throw 'missing nbvpn-windows-amd64-win2012.exe' }
          if (-not (Test-Path stage\nbvpn-gui-win2012.exe)) { throw 'missing nbvpn-gui-win2012.exe' }
          # Guard: never stage Fyne GUI or modern 1.1 into this product
          if (Test-Path stage\nbvpn-gui-windows-amd64.exe) { throw 'Fyne GUI must not be staged for win2012 Setup' }
          Get-ChildItem stage
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after choco install" }
          echo "ISCC=$iscc" >> $env:GITHUB_ENV
      - name: Build NetBridge-nbvpn-Setup-win2012.exe
        shell: pwsh
        env:
          NBVPN_VERSION: ${{ github.ref_name }}
        run: |
          $stage = (Resolve-Path stage).Path
          $out = Join-Path $stage 'dist'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & .\server\install\windows\build-setup-win2012.ps1 -StageDir $stage -OutDir $out -Version $env:NBVPN_VERSION
          $setup = Join-Path $out 'NetBridge-nbvpn-Setup-win2012.exe'
          if (-not (Test-Path $setup)) { throw "Setup-win2012 missing: $setup" }
          # Confirm legacy MSI (0.5.3) was staged — not 1.1
          $msi = Get-ChildItem (Join-Path $stage 'vendor\wireguard') -Filter 'wireguard-amd64-0.5.3.msi' -ErrorAction SilentlyContinue
          if (-not $msi) { throw 'Setup-win2012 build missing wireguard-amd64-0.5.3.msi' }
          Get-ChildItem $out
      - uses: actions/upload-artifact@v4
        with:
          name: nbvpn-windows-setup-win2012
          path: |
            stage/dist/NetBridge-nbvpn-Setup-win2012.exe
            stage/dist/NetBridge-nbvpn-Setup-win2012.exe.sha256

  package:
    name: package-server-zip
    needs: [linux, windows-win10, windows-win2012, windows-gui, windows-setup, windows-setup-win2012]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: nbvpn-*
          merge-multiple: true
      - name: Assemble zip
        run: |
          set -euo pipefail
          OUT=dist-server
          mkdir -p "$OUT/bin" "$OUT/install/windows" release-upload
          find artifacts -type f \( -name 'nbvpn-*' -o -name 'NetBridge-nbvpn-Setup*' \) -exec cp -f {} "$OUT/bin/" \;
          # Setup.exe may land under bin/ from merge; also copy explicitly if nested
          find artifacts -type f -name 'NetBridge-nbvpn-Setup*' -exec cp -f {} release-upload/ \;
          cp -a server/install/*.sh "$OUT/install/" 2>/dev/null || true
          cp -a server/install/*.md "$OUT/install/" 2>/dev/null || true
          cp -a server/install/windows/* "$OUT/install/windows/"
          (
            cd "$OUT"
            sha256sum bin/* > SHA256SUMS.txt 2>/dev/null || true
            zip -r "../nbvpn-server-${GITHUB_REF_NAME}.zip" .
          )
          cp -f nbvpn-server-*.zip release-upload/
          cp -f "$OUT"/bin/* release-upload/ 2>/dev/null || true
          ls -la release-upload
      - uses: actions/upload-artifact@v4
        with:
          name: nbvpn-server-bundle
          path: |
            nbvpn-server-*.zip
            release-upload/
      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-upload/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
